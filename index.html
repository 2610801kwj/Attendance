<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1학년 8반 출결 관리 System</title>
    <style>
        :root {
            --primary: #2da44e;
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-color: #1f2328;
            --border-color: #d0d7de;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px rgba(31,35,40,0.12);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 { font-size: 1.4rem; margin: 0; }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="date"], input[type="text"], input[type="password"] {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.btn-secondary { background-color: #f6f8fa; color: #24292f; border: 1px solid var(--border-color); }
        button.btn-danger { background-color: #cf222e; color: white; }
        button.btn-sm { padding: 3px 8px; font-size: 0.8rem; }

        .role-badge {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .role-none { background: #f3f4f6; color: #57606a; }
        .role-check { background: #ddf4ff; color: #0969da; }
        .role-admin { background: #ffebe9; color: #cf222e; }

        .tab-menu {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            color: var(--text-color);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: #0969da;
            color: white;
        }

        .config-panel {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f6f8fa;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-card .number { font-size: 1.3rem; font-weight: bold; margin-top: 4px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px 10px; text-align: center; border: 1px solid var(--border-color); }
        th { background-color: #f6f8fa; font-weight: 600; }

        select {
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .status-O { color: #1a7f37; font-weight: bold; }
        .status-L { color: #d97706; font-weight: bold; }
        .status-I { color: #0969da; font-weight: bold; }
        .status-S { color: #8250df; font-weight: bold; }

        .score-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            background: #fff8c5;
            color: #9a6700;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .sheet-container {
            overflow-x: auto;
            max-width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        
        .sheet-table {
            width: 100%;
            white-space: nowrap;
            font-size: 0.85rem;
        }
        .sheet-table th { background: #f1f5f9; }
        .sheet-table td.date-cell { min-width: 85px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>📦 1학년 8반 출결 관리</h1>
            <div style="margin-top: 6px;">
                <span id="roleBadge" class="role-badge role-none">🔒 접속 권한: 읽기 전용</span>
            </div>
        </div>
        <div class="controls">
            <button class="btn-secondary" onclick="authenticate()">🔑 인증하기</button>
            <button class="btn-secondary" onclick="toggleConfig()">⚙️ GitHub 토큰 설정</button>
            <button onclick="saveToGitHub()">💾 저장하기</button>
        </div>
    </header>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('check')">📋 오늘의 출결 작성</button>
        <button class="tab-btn" onclick="switchTab('history')">📊 스프레드시트 기록 종합</button>
    </div>

    <div id="configPanel" class="config-panel">
        <strong>⚙️ GitHub 인증 토큰 연동</strong>
        <p style="font-size: 0.85rem; color: #57606a; margin: 4px 0 10px 0;">현재 웹페이지의 저장소 정보가 자동으로 인식됩니다.</p>
        <div style="display: flex; gap: 8px; align-items: center;">
            <input type="password" id="ghToken" placeholder="GitHub Token 입력" style="flex: 1;">
            <button onclick="saveConfig()">토큰 저장</button>
        </div>
        <div id="repoDetectStatus" style="font-size: 0.8rem; margin-top: 8px; color: #0969da;"></div>
    </div>

    <div id="tabCheck" class="view-section active">
        <div style="margin-bottom: 12px;">
            <label><strong>날짜 선택: </strong></label>
            <input type="date" id="attendanceDate">
        </div>

        <div class="stats-bar">
            <div class="stat-card">전체 학생<div class="number" id="statTotal">23</div></div>
            <div class="stat-card">출석<div class="number status-O" id="statPresent">0</div></div>
            <div class="stat-card">오늘 지각<div class="number status-L" id="statLate">0</div></div>
            <div class="stat-card">인정<div class="number status-I" id="statRecognized">0</div></div>
            <div class="stat-card">질병<div class="number status-S" id="statSick">0</div></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 8%;">번호</th>
                    <th style="width: 16%;">이름</th>
                    <th style="width: 20%;">오늘 상태</th>
                    <th style="width: 22%;">누적 지각 점수</th>
                    <th style="width: 18%;">점수 차감 (관리자)</th>
                    <th style="width: 16%;">비고 / 사유</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
        </table>
    </div>

    <div id="tabHistory" class="view-section">
        <h3>📊 전체 출결 스프레드시트</h3>
        <p style="font-size: 0.9rem; color: #57606a;">날짜별 학생 출결 현황 및 누적 지각 점수 종합표입니다.</p>
        <div id="historyContainer">
        </div>
    </div>
</div>

<script>
    const students = [
        "권우진", "김규민", "김도엽", "김민석", "김민준", 
        "김성준", "김슬찬", "김승우", "김은율", "김재민", 
        "김준영", "김휘서", "명로찬", "박요산", "윤준용", 
        "정나후", "조문규", "차성민", "최예준", "최원정", 
        "최윤후", "최임성", "최지원"
    ];

    const KEY_CHECK = "5487328"; // 출결 작성 전용
    const KEY_ADMIN = "115962";  // 점수 차감 전용

    let currentRole = 'none';
    let currentAttendance = {};
    let fullAttendanceData = {};
    let currentFileSha = null;

    const dateInput = document.getElementById('attendanceDate');

    window.onload = function() {
        loadConfig();
        initDate();
        fetchFromGitHub();
    };

    // 현재 접속 중인 index.html 페이지의 URL에서 저장소 Owner/Repo 자동 감지
    function getAutoRepoInfo() {
        const host = window.location.hostname;
        const pathSegments = window.location.pathname.split('/').filter(Boolean);

        let owner = "";
        let repo = "";

        if (host.includes('github.io')) {
            owner = host.split('.')[0];
            repo = pathSegments.length > 0 ? pathSegments[0] : `${owner}.github.io`;
        } else {
            // 로컬 테스트 환경 시 기본 fallback
            owner = localStorage.getItem('gh_owner') || '';
            repo = localStorage.getItem('gh_repo') || '';
        }

        return { owner, repo };
    }

    function initDate() {
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        dateInput.addEventListener('change', () => {
            renderTableForCurrentDate();
        });
    }

    function authenticate() {
        if (currentRole !== 'none') {
            currentRole = 'none';
            updateRoleUI();
            renderTableForCurrentDate();
            alert('로그아웃 되었습니다.');
            return;
        }

        const inputKey = prompt("보안키를 입력하세요:");
        if (!inputKey) return;

        if (inputKey === KEY_CHECK) {
            currentRole = 'check';
            alert('출결 작성 전용 권한으로 인증되었습니다.');
        } else if (inputKey === KEY_ADMIN) {
            currentRole = 'admin';
            alert('점수 차감 전용 권한으로 인증되었습니다.');
        } else {
            alert('올바르지 않은 보안키입니다.');
        }

        updateRoleUI();
        renderTableForCurrentDate();
    }

    function updateRoleUI() {
        const badge = document.getElementById('roleBadge');
        if (currentRole === 'check') {
            badge.innerText = "🔑 권한: 출결 작성 전용";
            badge.className = "role-badge role-check";
        } else if (currentRole === 'admin') {
            badge.innerText = "⚡ 권한: 점수 차감 전용";
            badge.className = "role-badge role-admin";
        } else {
            badge.innerText = "🔒 권한: 읽기 전용";
            badge.className = "role-badge role-none";
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'check') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tabCheck').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tabHistory').classList.add('active');
            renderHistoryView();
        }
    }

    function toggleConfig() {
        const panel = document.getElementById('configPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function saveConfig() {
        localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
        document.getElementById('configPanel').style.display = 'none';
        fetchFromGitHub();
    }

    function loadConfig() {
        document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
        const repoInfo = getAutoRepoInfo();
        const statusDiv = document.getElementById('repoDetectStatus');
        if (repoInfo.owner && repoInfo.repo) {
            statusDiv.innerText = `📍 감지된 저장소: ${repoInfo.owner}/${repoInfo.repo}`;
        }
    }

    async function fetchFromGitHub() {
        const repoInfo = getAutoRepoInfo();
        const token = localStorage.getItem('gh_token');
        if (!repoInfo.owner || !repoInfo.repo || !token) return;

        const url = `https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/data/attendance.json`;
        try {
            const res = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (res.ok) {
                const data = await res.json();
                currentFileSha = data.sha;
                fullAttendanceData = JSON.parse(base64ToUtf8(data.content));
                renderTableForCurrentDate();
            }
        } catch (e) { console.error(e); }
    }

    async function saveToGitHub() {
        const repoInfo = getAutoRepoInfo();
        const token = localStorage.getItem('gh_token');

        if (!repoInfo.owner || !repoInfo.repo || !token) {
            alert('GitHub 인증 토큰을 먼저 설정해주세요.');
            toggleConfig();
            return;
        }

        const dateKey = dateInput.value;
        fullAttendanceData[dateKey] = currentAttendance;

        const url = `https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/data/attendance.json`;
        const bodyData = {
            message: `Save attendance for ${dateKey}`,
            content: utf8ToBase64(JSON.stringify(fullAttendanceData, null, 2))
        };
        if (currentFileSha) bodyData.sha = currentFileSha;

        try {
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
            if (res.ok) {
                const resData = await res.json();
                currentFileSha = resData.content.sha;
                alert(`✅ ${dateKey} 출결 및 점수 정보가 ${repoInfo.repo} 저장소에 연동 저장되었습니다.`);
            } else {
                alert('저장 실패: GitHub 토큰 권한을 확인하세요.');
            }
        } catch (e) { alert('오류: ' + e.message); }
    }

    function getStudentLateScore(studentNo) {
        let rawLateCount = 0;
        
        Object.keys(fullAttendanceData).forEach(date => {
            if (date === '_adjustments') return;
            const dayData = fullAttendanceData[date];
            if (dayData && dayData[studentNo] && dayData[studentNo].status === '지각') {
                rawLateCount++;
            }
        });

        if (!fullAttendanceData['_adjustments']) {
            fullAttendanceData['_adjustments'] = {};
        }

        const deducted = fullAttendanceData['_adjustments'][studentNo] || 0;
        const finalScore = Math.max(0, rawLateCount - deducted);

        return { rawLateCount, deducted, finalScore };
    }

    function deductScore(studentNo) {
        if (!fullAttendanceData['_adjustments']) fullAttendanceData['_adjustments'] = {};
        
        const currentDeducted = fullAttendanceData['_adjustments'][studentNo] || 0;
        fullAttendanceData['_adjustments'][studentNo] = currentDeducted + 1;
        
        renderTableForCurrentDate();
    }

    function restoreScore(studentNo) {
        if (!fullAttendanceData['_adjustments']) fullAttendanceData['_adjustments'] = {};
        
        const currentDeducted = fullAttendanceData['_adjustments'][studentNo] || 0;
        if (currentDeducted > 0) {
            fullAttendanceData['_adjustments'][studentNo] = currentDeducted - 1;
        }
        
        renderTableForCurrentDate();
    }

    function renderTableForCurrentDate() {
        const dateKey = dateInput.value;
        
        if (!fullAttendanceData[dateKey]) {
            fullAttendanceData[dateKey] = {};
        }
        currentAttendance = fullAttendanceData[dateKey];

        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = '';

        const canCheck = (currentRole === 'check');
        const canAdmin = (currentRole === 'admin');

        students.forEach((name, idx) => {
            const no = idx + 1;
            if (!currentAttendance[no]) {
                currentAttendance[no] = { status: 'O', note: '' };
            }
            const record = currentAttendance[no];
            const lateStats = getStudentLateScore(no);

            const tr = document.createElement('tr');

            tr.innerHTML = `
                <td>${no}</td>
                <td><strong>${name}</strong></td>
                <td>
                    <select ${!canCheck ? 'disabled' : ''} onchange="updateRecord(${no}, 'status', this.value)">
                        <option value="O" ${record.status === 'O' ? 'selected' : ''}>출석</option>
                        <option value="지각" ${record.status === '지각' ? 'selected' : ''}>지각</option>
                        <option value="인정" ${record.status === '인정' ? 'selected' : ''}>인정</option>
                        <option value="질병" ${record.status === '질병' ? 'selected' : ''}>질병</option>
                    </select>
                </td>
                <td>
                    <span class="score-tag">총 ${lateStats.finalScore}점 (지각 ${lateStats.rawLateCount}회)</span>
                    ${lateStats.deducted > 0 ? `<br><small style="color:#0969da;">(-${lateStats.deducted}점 차감됨)</small>` : ''}
                </td>
                <td>
                    <button class="btn-danger btn-sm" ${!canAdmin ? 'disabled' : ''} onclick="deductScore(${no})">-1점 차감</button>
                    <button class="btn-secondary btn-sm" ${!canAdmin || lateStats.deducted <= 0 ? 'disabled' : ''} onclick="restoreScore(${no})">복구</button>
                </td>
                <td>
                    <input type="text" value="${record.note || ''}" placeholder="사유 입력" style="width: 90%;"
                        ${!canCheck ? 'disabled' : ''}
                        onchange="updateRecord(${no}, 'note', this.value)">
                </td>
            `;
            tbody.appendChild(tr);
        });

        updateStats();
    }

    function updateRecord(no, field, val) {
        if (!currentAttendance[no]) {
            currentAttendance[no] = { status: 'O', note: '' };
        }
        currentAttendance[no][field] = val;
        renderTableForCurrentDate();
    }

    function updateStats() {
        let total = students.length;
        let present = 0, late = 0, recognized = 0, sick = 0;

        students.forEach((_, idx) => {
            const no = idx + 1;
            const rec = currentAttendance[no] || { status: 'O' };

            if (rec.status === 'O') present++;
            else if (rec.status === '지각') late++;
            else if (rec.status === '인정') recognized++;
            else if (rec.status === '질병') sick++;
        });

        document.getElementById('statTotal').innerText = total;
        document.getElementById('statPresent').innerText = present;
        document.getElementById('statLate').innerText = late;
        document.getElementById('statRecognized').innerText = recognized;
        document.getElementById('statSick').innerText = sick;
    }

    function renderHistoryView() {
        const container = document.getElementById('historyContainer');
        container.innerHTML = '';

        const dates = Object.keys(fullAttendanceData).filter(d => d !== '_adjustments').sort();

        if (dates.length === 0) {
            container.innerHTML = '<p style="color: #8c959f;">저장된 기록이 없습니다.</p>';
            return;
        }

        let tableHtml = `
            <div class="sheet-container">
                <table class="sheet-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;">번호</th>
                            <th style="width: 90px;">이름</th>
                            ${dates.map(d => `<th class="date-cell">${d}</th>`).join('')}
                            <th style="width: 80px; background: #fff8c5;">지각 횟수</th>
                            <th style="width: 80px; background: #ffebe9;">차감 점수</th>
                            <th style="width: 90px; background: #ddf4ff;">최종 점수</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        students.forEach((name, idx) => {
            const no = idx + 1;
            const lateStats = getStudentLateScore(no);

            tableHtml += `
                <tr>
                    <td>${no}</td>
                    <td><strong>${name}</strong></td>
            `;

            dates.forEach(dateStr => {
                const rec = (fullAttendanceData[dateStr] && fullAttendanceData[dateStr][no]) 
                    ? fullAttendanceData[dateStr][no] 
                    : { status: '-' };
                
                let statusClass = '';
                if (rec.status === 'O') statusClass = 'status-O';
                else if (rec.status === '지각') statusClass = 'status-L';
                else if (rec.status === '인정') statusClass = 'status-I';
                else if (rec.status === '질병') statusClass = 'status-S';

                tableHtml += `<td class="date-cell ${statusClass}">${rec.status || '-'}</td>`;
            });

            tableHtml += `
                    <td style="background: #fff8c5;">${lateStats.rawLateCount}회</td>
                    <td style="background: #ffebe9; color: #cf222e;">-${lateStats.deducted}점</td>
                    <td style="background: #ddf4ff;"><strong>${lateStats.finalScore}점</strong></td>
                </tr>
            `;
        });

        tableHtml += `
                    </tbody>
                </table>
            </div>
        `;

        container.innerHTML = tableHtml;
    }

    function utf8ToBase64(str) {
        return btoa(String.fromCodePoint(...new TextEncoder().encode(str)));
    }

    function base64ToUtf8(base64) {
        return new TextDecoder().decode(Uint8Array.from(atob(base64.replace(/\s/g, '')), m => m.codePointAt(0)));
    }
</script>
</body>
</html>
