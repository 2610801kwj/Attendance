<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1학년 8반 출결 관리 System</title>
    <style>
        :root {
            --primary: #2da44e;
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-color: #1f2328;
            --border-color: #d0d7de;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px rgba(31,35,40,0.12);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 { font-size: 1.4rem; margin: 0; }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="date"], input[type="text"], input[type="password"] {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button.btn-secondary { background-color: #f6f8fa; color: #24292f; border: 1px solid var(--border-color); }

        .role-badge {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .role-none { background: #f3f4f6; color: #57606a; }
        .role-check { background: #ddf4ff; color: #0969da; }

        .tab-menu {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            color: var(--text-color);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: #0969da;
            color: white;
        }

        .config-panel {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f6f8fa;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-card .number { font-size: 1.3rem; font-weight: bold; margin-top: 4px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f6f8fa; font-weight: 600; }

        select {
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .status-O { color: #1a7f37; font-weight: bold; }
        .status-L { color: #d97706; font-weight: bold; }
        .status-I { color: #0969da; font-weight: bold; }
        .status-S { color: #8250df; font-weight: bold; }

        .view-section { display: none; }
        .view-section.active { display: block; }
        
        .history-card {
            background: #f6f8fa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>📦 1학년 8반 출결 관리</h1>
            <div style="margin-top: 6px;">
                <span id="roleBadge" class="role-badge role-none">🔒 접속 권한: 읽기 전용</span>
            </div>
        </div>
        <div class="controls">
            <button class="btn-secondary" onclick="authenticate()">🔑 인증하기</button>
            <button class="btn-secondary" onclick="toggleConfig()">⚙️ GitHub 설정</button>
            <button onclick="saveToGitHub()">💾 저장하기</button>
        </div>
    </header>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('check')">📋 오늘의 출결 작성</button>
        <button class="tab-btn" onclick="switchTab('history')">📂 저장된 기록 조회</button>
    </div>

    <div id="configPanel" class="config-panel">
        <strong>⚙️ GitHub Repository 연동 설정</strong>
        <div class="config-grid">
            <input type="text" id="ghOwner" placeholder="GitHub Username">
            <input type="text" id="ghRepo" placeholder="Repository 이름">
            <input type="password" id="ghToken" placeholder="GitHub Token">
        </div>
        <div style="margin-top: 10px; text-align: right;">
            <button onclick="saveConfig()">설정 저장</button>
        </div>
    </div>

    <div id="tabCheck" class="view-section active">
        <div style="margin-bottom: 12px;">
            <label><strong>날짜 선택: </strong></label>
            <input type="date" id="attendanceDate">
        </div>

        <div class="stats-bar">
            <div class="stat-card">전체 학생<div class="number" id="statTotal">23</div></div>
            <div class="stat-card">출석<div class="number status-O" id="statPresent">0</div></div>
            <div class="stat-card">지각<div class="number status-L" id="statLate">0</div></div>
            <div class="stat-card">인정<div class="number status-I" id="statRecognized">0</div></div>
            <div class="stat-card">질병<div class="number status-S" id="statSick">0</div></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">번호</th>
                    <th style="width: 25%;">이름</th>
                    <th style="width: 30%;">출석 상태</th>
                    <th style="width: 35%;">비고 / 사유</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
        </table>
    </div>

    <div id="tabHistory" class="view-section">
        <h3>📂 누적 출결 기록 목록</h3>
        <p style="font-size: 0.9rem; color: #57606a;">사이트에 저장된 날짜별 출결 데이터 현황입니다.</p>
        <div id="historyContainer">
        </div>
    </div>
</div>

<script>
    const students = [
        "권우진", "김규민", "김도엽", "김민석", "김민준", 
        "김성준", "김슬찬", "김승우", "김은율", "김재민", 
        "김준영", "김휘서", "명로찬", "박요산", "윤준용", 
        "정나후", "조문규", "차성민", "최예준", "최원정", 
        "최윤후", "최임성", "최지원"
    ];

    const KEY_CHECK = "1234";

    let currentRole = 'none';
    let currentAttendance = {};
    let fullAttendanceData = {};
    let currentFileSha = null;

    const dateInput = document.getElementById('attendanceDate');

    window.onload = function() {
        loadConfig();
        initDate();
        fetchFromGitHub();
    };

    function initDate() {
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        dateInput.addEventListener('change', () => {
            renderTableForCurrentDate();
        });
    }

    function authenticate() {
        if (currentRole !== 'none') {
            currentRole = 'none';
            updateRoleUI();
            renderTableForCurrentDate();
            alert('로그아웃 되었습니다.');
            return;
        }

        const inputKey = prompt("보안키를 입력하세요:");
        if (!inputKey) return;

        if (inputKey === KEY_CHECK) {
            currentRole = 'check';
            alert('출결 작성 권한으로 인증되었습니다.');
        } else {
            alert('올바르지 않은 보안키입니다.');
        }

        updateRoleUI();
        renderTableForCurrentDate();
    }

    function updateRoleUI() {
        const badge = document.getElementById('roleBadge');
        if (currentRole === 'check') {
            badge.innerText = "🔑 권한: 출결 작성 모드";
            badge.className = "role-badge role-check";
        } else {
            badge.innerText = "🔒 권한: 읽기 전용";
            badge.className = "role-badge role-none";
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'check') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tabCheck').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tabHistory').classList.add('active');
            renderHistoryView();
        }
    }

    function toggleConfig() {
        const panel = document.getElementById('configPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function saveConfig() {
        localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
        localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
        localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
        document.getElementById('configPanel').style.display = 'none';
        fetchFromGitHub();
    }

    function loadConfig() {
        document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || '';
        document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
    }

    async function fetchFromGitHub() {
        const owner = localStorage.getItem('gh_owner');
        const repo = localStorage.getItem('gh_repo');
        const token = localStorage.getItem('gh_token');
        if (!owner || !repo || !token) return;

        const url = `https://api.github.com/repos/${owner}/${repo}/contents/data/attendance.json`;
        try {
            const res = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (res.ok) {
                const data = await res.json();
                currentFileSha = data.sha;
                fullAttendanceData = JSON.parse(base64ToUtf8(data.content));
                renderTableForCurrentDate();
            }
        } catch (e) { console.error(e); }
    }

    async function saveToGitHub() {
        const owner = localStorage.getItem('gh_owner');
        const repo = localStorage.getItem('gh_repo');
        const token = localStorage.getItem('gh_token');

        if (!owner || !repo || !token) {
            alert('GitHub 설정을 먼저 완료해주세요.');
            toggleConfig();
            return;
        }

        const dateKey = dateInput.value;
        fullAttendanceData[dateKey] = currentAttendance;

        const url = `https://api.github.com/repos/${owner}/${repo}/contents/data/attendance.json`;
        const bodyData = {
            message: `Save attendance for ${dateKey}`,
            content: utf8ToBase64(JSON.stringify(fullAttendanceData, null, 2))
        };
        if (currentFileSha) bodyData.sha = currentFileSha;

        try {
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
            if (res.ok) {
                const resData = await res.json();
                currentFileSha = resData.content.sha;
                alert(`✅ ${dateKey} 출결 기록이 저장되었습니다.`);
            } else {
                alert('저장 실패: GitHub 권한을 확인하세요.');
            }
        } catch (e) { alert('오류: ' + e.message); }
    }

    function renderTableForCurrentDate() {
        const dateKey = dateInput.value;
        
        if (!fullAttendanceData[dateKey]) {
            fullAttendanceData[dateKey] = {};
        }
        currentAttendance = fullAttendanceData[dateKey];

        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = '';

        const canCheck = (currentRole === 'check');

        students.forEach((name, idx) => {
            const no = idx + 1;
            if (!currentAttendance[no]) {
                currentAttendance[no] = { status: 'O', note: '' };
            }
            const record = currentAttendance[no];

            const tr = document.createElement('tr');

            tr.innerHTML = `
                <td>${no}</td>
                <td><strong>${name}</strong></td>
                <td>
                    <select ${!canCheck ? 'disabled' : ''} onchange="updateRecord(${no}, 'status', this.value)">
                        <option value="O" ${record.status === 'O' ? 'selected' : ''}>출석</option>
                        <option value="지각" ${record.status === '지각' ? 'selected' : ''}>지각</option>
                        <option value="인정" ${record.status === '인정' ? 'selected' : ''}>인정</option>
                        <option value="질병" ${record.status === '질병' ? 'selected' : ''}>질병</option>
                    </select>
                </td>
                <td>
                    <input type="text" value="${record.note || ''}" placeholder="사유 입력" style="width: 90%;"
                        ${!canCheck ? 'disabled' : ''}
                        onchange="updateRecord(${no}, 'note', this.value)">
                </td>
            `;
            tbody.appendChild(tr);
        });

        updateStats();
    }

    function updateRecord(no, field, val) {
        if (!currentAttendance[no]) {
            currentAttendance[no] = { status: 'O', note: '' };
        }
        currentAttendance[no][field] = val;
        updateStats();
    }

    function updateStats() {
        let total = students.length;
        let present = 0, late = 0, recognized = 0, sick = 0;

        students.forEach((_, idx) => {
            const no = idx + 1;
            const rec = currentAttendance[no] || { status: 'O' };

            if (rec.status === 'O') present++;
            else if (rec.status === '지각') late++;
            else if (rec.status === '인정') recognized++;
            else if (rec.status === '질병') sick++;
        });

        document.getElementById('statTotal').innerText = total;
        document.getElementById('statPresent').innerText = present;
        document.getElementById('statLate').innerText = late;
        document.getElementById('statRecognized').innerText = recognized;
        document.getElementById('statSick').innerText = sick;
    }

    function renderHistoryView() {
        const container = document.getElementById('historyContainer');
        container.innerHTML = '';

        const dates = Object.keys(fullAttendanceData).sort().reverse();
        if (dates.length === 0) {
            container.innerHTML = '<p style="color: #8c959f;">저장된 기록이 없습니다.</p>';
            return;
        }

        dates.forEach(dateStr => {
            const dayData = fullAttendanceData[dateStr];
            let present = 0, late = 0, recognized = 0, sick = 0;

            Object.values(dayData).forEach(r => {
                if (r.status === 'O') present++;
                else if (r.status === '지각') late++;
                else if (r.status === '인정') recognized++;
                else if (r.status === '질병') sick++;
            });

            const card = document.createElement('div');
            card.className = 'history-card';
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <strong>📅 ${dateStr}</strong>
                    <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="loadDateFromHistory('${dateStr}')">이 날짜 조회/수정</button>
                </div>
                <div style="margin-top: 8px; font-size: 0.85rem; color: #57606a;">
                    출석: <span class="status-O">${present}명</span> | 
                    지각: <span class="status-L">${late}명</span> | 
                    인정: <span class="status-I">${recognized}명</span> | 
                    질병: <span class="status-S">${sick}명</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function loadDateFromHistory(selectedDate) {
        dateInput.value = selectedDate;
        switchTab('check');
        renderTableForCurrentDate();
    }

    function utf8ToBase64(str) {
        return btoa(String.fromCodePoint(...new TextEncoder().encode(str)));
    }

    function base64ToUtf8(base64) {
        return new TextDecoder().decode(Uint8Array.from(atob(base64.replace(/\s/g, '')), m => m.codePointAt(0)));
    }
</script>
</body>
</html>
